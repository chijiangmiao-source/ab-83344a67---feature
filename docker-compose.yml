services:
  app:
    build: .
    image: calibration-macro-app
    environment:
      PORT: 8080
    ports:
      # 宿主机端口可配置：APP_PORT=9090 docker compose up
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.PORT||8080;fetch('http://127.0.0.1:'+p+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  verify:
    image: calibration-macro-app
    build: .
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_URL: http://app:8080
    command: ["node", "scripts/verify.js"]
    healthcheck:
      disable: true
